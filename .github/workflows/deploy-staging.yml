name: Deploy Staging (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate staging configuration and Auth0
        env:
          AUTH0_DOMAIN_STAGING: ${{ vars.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ vars.AUTH0_CLIENT_ID_STAGING }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'wrangler.staging.jsonc';
          const c = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (c.name !== 'githua-sales-assistant-staging' || c.d1_databases?.[0]?.database_id !== 'c1a2dd96-8530-4132-8737-2ad0cd693df2' || c.d1_databases?.[0]?.database_name !== 'githua-sales-assistant-staging') throw Error('Staging isolation validation failed');
          const domain = process.env.AUTH0_DOMAIN_STAGING?.trim();
          const client = process.env.AUTH0_CLIENT_ID_STAGING?.trim();
          if (!domain || !client) throw Error('Set staging environment variables AUTH0_DOMAIN_STAGING and AUTH0_CLIENT_ID_STAGING');
          if (domain === 'dev-xdx15sdqsgcvtynj.us.auth0.com' && client === '0LKaX8JbImoUTVGjVG5PQMbFvYEsGiJ9') throw Error('Do not reuse the production Auth0 application in staging');
          c.vars.AUTH0_DOMAIN = domain;
          c.vars.AUTH0_CLIENT_ID = client;
          fs.writeFileSync(file, JSON.stringify(c, null, 2) + '\n');
          NODE
      - name: Run tests
        run: npm test
      - name: Check Cloudflare access and staging Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing staging Cloudflare credentials'; exit 1; }
          npx wrangler secret list --config wrangler.staging.jsonc > /tmp/staging-secret-list.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = new Set(JSON.parse(fs.readFileSync('/tmp/staging-secret-list.json','utf8')).map(x=>x.name));
          for (const name of ['SESSION_SECRET','AUTH0_CLIENT_SECRET']) if (!names.has(name)) throw Error('Missing staging Worker secret: '+name);
          NODE
      - name: Apply staging D1 migrations only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply githua-sales-assistant-staging --remote --config wrangler.staging.jsonc --yes
      - name: Deploy staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc
